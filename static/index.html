<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineData Analytics — Agente</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { font-size: 1.4rem; }
    textarea {
      width: 100%;
      min-height: 4.5rem;
      font: inherit;
      padding: 0.6rem;
      box-sizing: border-box;
    }
    button {
      margin-top: 0.5rem;
      padding: 0.5rem 1.2rem;
      font: inherit;
      cursor: pointer;
    }
    #answer {
      margin-top: 1.5rem;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    #meta { color: #888; font-size: 0.85rem; margin-top: 0.5rem; }
    canvas { margin-top: 1.5rem; max-height: 360px; }
    code { background: rgba(128,128,128,0.15); padding: 0.1rem 0.3rem; border-radius: 4px; }
    pre {
      background: rgba(128,128,128,0.1);
      padding: 0.6rem;
      border-radius: 4px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
    details { margin-top: 1rem; }
    summary { cursor: pointer; font-size: 0.9rem; color: #888; }
    #confidence {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    #confidence.alta { background: rgba(0,170,80,0.2); }
    #confidence.media { background: rgba(230,160,0,0.2); }
    #confidence.baixa { background: rgba(220,50,50,0.2); }
  </style>
</head>
<body>
  <h1>CineData Analytics — Agente Text-to-SQL</h1>
  <p>Faça uma pergunta sobre o catálogo de filmes (bilheteria, popularidade, elenco, gêneros, avaliações...).</p>

  <textarea id="question" placeholder="Ex.: Quais os 10 filmes com maior receita em R$?"></textarea>
  <br />
  <button id="ask">Perguntar</button>

  <div id="answer"></div>
  <div id="meta"></div>
  <canvas id="chart" style="display:none"></canvas>

  <pre id="sql" style="display:none"><code></code></pre>

  <details id="reasoning-block" style="display:none">
    <summary>Detalhes técnicos (raciocínio e schema linking)</summary>
    <p id="reasoning"></p>
    <p id="schema-link"></p>
  </details>

  <script>
    const sessionId = crypto.randomUUID();
    let chart = null;

    async function ask() {
      const question = document.getElementById("question").value.trim();
      if (!question) return;

      const answerEl = document.getElementById("answer");
      const metaEl = document.getElementById("meta");
      answerEl.textContent = "Pensando...";
      metaEl.textContent = "";

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, session_id: sessionId }),
        });
        const body = await res.json();

        if (!res.ok) {
          answerEl.textContent = "Erro: " + (body.detail || res.statusText);
          return;
        }

        answerEl.textContent = body.answer;
        renderMeta(metaEl, body);
        renderSqlIfPresent(body.sql_used);
        renderReasoningIfPresent(body.reasoning, body.schema_link);
        renderChartIfApplicable(body.data);
      } catch (err) {
        answerEl.textContent = "Erro ao chamar a API: " + err;
      }
    }

    function renderMeta(metaEl, body) {
      // Construído via DOM (textContent/createElement), nunca innerHTML —
      // model_used e sql_used.length vêm da API, mas não há motivo para
      // depender disso continuar seguro no futuro.
      metaEl.textContent = "";
      metaEl.append(`Modelo: ${body.model_used}`);

      if (body.sql_used?.length) {
        metaEl.append(` · SQL: ${body.sql_used.length} consulta(s)`);
      }

      const confidenceEl = buildConfidenceBadge(body.confidence);
      if (confidenceEl) {
        metaEl.append(" · ", confidenceEl);
      }
    }

    function buildConfidenceBadge(confidence) {
      if (typeof confidence !== "number") return null;
      const pct = Math.round(confidence * 100);
      const level = confidence >= 0.75 ? "alta" : confidence >= 0.4 ? "media" : "baixa";
      const span = document.createElement("span");
      span.id = "confidence";
      span.className = level;
      span.textContent = `Confiança: ${pct}%`;
      return span;
    }

    function renderSqlIfPresent(sqlUsed) {
      const sqlEl = document.getElementById("sql");
      if (!Array.isArray(sqlUsed) || sqlUsed.length === 0) {
        sqlEl.style.display = "none";
        return;
      }
      sqlEl.querySelector("code").textContent = sqlUsed.join("\n\n");
      sqlEl.style.display = "block";
    }

    function renderReasoningIfPresent(reasoning, schemaLink) {
      const block = document.getElementById("reasoning-block");
      const reasoningEl = document.getElementById("reasoning");
      const schemaLinkEl = document.getElementById("schema-link");

      if (!reasoning && !schemaLink) {
        block.style.display = "none";
        return;
      }

      reasoningEl.textContent = reasoning ? `Raciocínio: ${reasoning}` : "";
      schemaLinkEl.textContent = schemaLink?.tables?.length
        ? `Schema linking — tabelas: ${schemaLink.tables.join(", ")}`
        : "";
      block.style.display = "block";
    }

    function renderChartIfApplicable(data) {
      const canvas = document.getElementById("chart");
      if (chart) { chart.destroy(); chart = null; }

      if (!Array.isArray(data) || data.length === 0 || data.length > 25) {
        canvas.style.display = "none";
        return;
      }

      const keys = Object.keys(data[0]);
      const labelKey = keys.find((k) => typeof data[0][k] === "string") || keys[0];
      const valueKey = keys.find((k) => typeof data[0][k] === "number");
      if (!valueKey) {
        canvas.style.display = "none";
        return;
      }

      canvas.style.display = "block";
      chart = new Chart(canvas, {
        type: "bar",
        data: {
          labels: data.map((row) => String(row[labelKey])),
          datasets: [{ label: valueKey, data: data.map((row) => row[valueKey]) }],
        },
      });
    }

    document.getElementById("ask").addEventListener("click", ask);
    document.getElementById("question").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
    });
  </script>
</body>
</html>
