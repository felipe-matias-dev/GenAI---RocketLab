name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # O banco real (580MB) não está no repositório: a suíte roda contra uma
      # amostra com o mesmo schema (scripts/build_sample_db.py).
      DB_PATH: tests/fixtures/cinerocket_sample.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testes
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t cinedata-agent .
